services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      TZ: Europe/Paris
    volumes:
      - db_data:/var/lib/mysql
      # Importé une seule fois, au premier démarrage (volume db_data vide).
      - "./bdd/inventaire_physique (8).sql:/docker-entrypoint-initdb.d/init.sql:ro"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Remet la base de démonstration à son état d'origine aux heures de RESET_TIMES.
  # Remise à zéro manuelle : docker compose exec reset sh /reset-db.sh now
  reset:
    image: mariadb:11.8
    restart: unless-stopped
    entrypoint: ["sh", "/reset-db.sh"]
    environment:
      DB_NAME: ${DB_NAME}
      DB_ROOT_PASS: ${DB_ROOT_PASS}
      RESET_TIMES: ${RESET_TIMES:-04:00 13:00}
      TZ: Europe/Paris
    volumes:
      - ./docker/reset-db.sh:/reset-db.sh:ro
      - "./bdd/inventaire_physique (8).sql:/dump.sql:ro"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      # Affiché sur la page de connexion pour prévenir les visiteurs
      RESET_TIMES: ${RESET_TIMES:-04:00 13:00}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 (QUIC) : Caddy l'annonce aux navigateurs, le port UDP doit donc être publié
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  db_data:
  caddy_data:
  caddy_config:
